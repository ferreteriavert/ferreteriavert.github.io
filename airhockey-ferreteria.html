<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Air Hockey Ferretería Vert</title>
<style>
  :root {
    --fondo: #000000;
    --tinta: #ffffff;
    --tarjeta: #171717;
    --borde: #2e2e2e;
    --gris: #a3a3a3;
    --acento: #ff0000;
    --ok: #3ddc84;
    --oro: #ffd34d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--fondo); color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }

  .pantalla { display: none; height: 100%; padding: clamp(16px, 3vmin, 40px); flex-direction: column; gap: clamp(12px, 2.2vmin, 26px); overflow: hidden; position: relative; }
  .pantalla > * { flex-shrink: 0; }
  .pantalla.activa { display: flex; animation: entra .25s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .boton-grande { background: var(--acento); border: 3px solid var(--acento); color: #fff; border-radius: 20px; padding: clamp(14px, 2.4vmin, 26px); font-weight: 800; font-size: clamp(20px, 3.4vmin, 36px); }
  .boton-grande.secundario { background: var(--tarjeta); color: var(--tinta); border: 3px solid var(--borde); }
  .boton-grande:active:not(:disabled) { transform: scale(.98); }
  .boton-grande:disabled { opacity: .35; }
  .botones-fila { display: flex; gap: clamp(10px, 2vmin, 22px); }
  .botones-fila > button { flex: 1; }

  /* ---------- Inicio ---------- */
  .centro { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 4vmin, 48px); }
  .logo { display: block; height: auto; }
  .logo-inicio { width: min(74vw, 84vmin); }
  .logo-peq { height: clamp(40px, 8vmin, 100px); width: auto; margin: 0 auto; }
  .sub { margin: 0; text-align: center; font-size: clamp(22px, 4vmin, 44px); font-weight: 800; }
  .sub b { color: var(--acento); }
  .botones-inicio { display: flex; flex-direction: column; gap: clamp(14px, 2.6vmin, 30px); width: min(760px, 100%); }
  .boton-inicio { background: var(--acento); border: 4px solid var(--acento); color: #fff; border-radius: 28px; padding: clamp(20px, 3.6vmin, 44px); font-weight: 900; font-size: clamp(28px, 5.2vmin, 64px); }
  .boton-inicio.secundario { background: transparent; }
  .boton-inicio:active { transform: scale(.97); }
  #pantalla-completa { position: absolute; top: 12px; right: 12px; background: transparent; font-size: 28px; opacity: .45; padding: 8px 12px; z-index: 5; }

  /* ---------- Juego ---------- */
  #juego { padding: clamp(10px, 1.8vmin, 26px); gap: 0; }
  .juego-grid { flex: 1 1 auto; min-height: 0; display: grid; gap: clamp(10px, 1.8vmin, 26px); }
  .col { display: flex; flex-direction: column; gap: clamp(10px, 1.8vmin, 22px); min-height: 0; }
  .col-izq { justify-content: space-between; }
  .salir { align-self: flex-start; background: var(--tarjeta); border-radius: 999px; padding: 10px 22px; font-weight: 700; font-size: clamp(15px, 2.4vmin, 24px); border: 2px solid var(--borde); }
  .logo-juego { width: min(100%, 38vmin); margin: 0 auto; }
  .rotulo { font-size: clamp(13px, 2.1vmin, 22px); font-weight: 800; letter-spacing: .18em; color: var(--gris); text-align: center; }
  .marcador { background: var(--tarjeta); border: 3px solid var(--borde); border-radius: 22px; padding: clamp(8px, 1.6vmin, 18px) 12px; text-align: center; }
  #puntos { font-size: clamp(44px, 11vmin, 150px); font-weight: 900; color: var(--acento); line-height: 1; font-variant-numeric: tabular-nums; }
  #puntos.sube { animation: latido .35s ease-out; }
  @keyframes latido { 40% { transform: scale(1.12); color: #fff; } }
  .bolas-card { background: var(--tarjeta); border: 3px solid var(--borde); border-radius: 22px; padding: clamp(8px, 1.6vmin, 18px) 12px; text-align: center; position: relative; }
  .bolas-num { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: clamp(34px, 8vmin, 100px); font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .bola-ico { width: .7em; height: .7em; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #fff 0, #c9ced2 28%, #6d7378 62%, #25282b 100%); box-shadow: 0 .08em .12em rgba(0,0,0,.7); }
  #extra { position: absolute; right: 16px; top: 8px; font-weight: 900; color: var(--ok); font-size: clamp(18px, 3.4vmin, 40px); opacity: 0; }
  #extra.ver { animation: extra 1.4s ease-out; }
  @keyframes extra { 0% { opacity: 0; transform: translateY(14px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }

  .boton-soltar { background: linear-gradient(#ff3b3b, #d80000 55%, #a40000); border: 4px solid #ff6a6a; color: #fff; border-radius: 28px; padding: clamp(18px, 3.4vmin, 44px) 12px; font-weight: 900; font-size: clamp(24px, 4.6vmin, 58px); letter-spacing: .04em; box-shadow: 0 .5vmin 0 #6a0000, 0 1.6vmin 3vmin rgba(255,0,0,.35); }
  .boton-soltar:active:not(:disabled) { transform: translateY(.5vmin); box-shadow: 0 0 0 #6a0000, 0 .6vmin 1.4vmin rgba(255,0,0,.3); }
  .boton-soltar:disabled { filter: grayscale(.8) brightness(.55); }
  .ayuda { text-align: center; color: var(--gris); font-size: clamp(13px, 2vmin, 21px); font-weight: 600; margin-top: -4px; }

  .hueco { position: relative; min-width: 0; min-height: 0; perspective: 1500px; }
  .mesa { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotateX(14deg); background: #000; border: clamp(8px, 1.4vmin, 18px) solid #2a0505; border-radius: 22px; box-shadow: 0 0 0 3px var(--acento), 0 1.4vmin 0 3px #5a0000, 0 3vmin 0 3px #2a0000, 0 6vmin 7vmin rgba(0,0,0,.95), 0 0 6vmin rgba(255,0,0,.35); overflow: hidden; }
  #lienzo { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .cristal { position: absolute; inset: 0; pointer-events: none; background:
      linear-gradient(112deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.075) 30%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 52%, rgba(255,255,255,.05) 58%, rgba(255,255,255,0) 64%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%); }
  #banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; z-index: 4; width: 96%; }
  #banner.ver { animation: banner 2.4s ease-out; }
  #banner .b1 { font-size: clamp(30px, 8vmin, 96px); font-weight: 900; color: var(--oro); text-shadow: 0 0 .4em rgba(255,0,0,.9), 0 .06em 0 #7a0000, 0 .12em .3em rgba(0,0,0,.9); line-height: 1.05; }
  #banner .b2 { font-size: clamp(18px, 4vmin, 48px); font-weight: 800; color: #fff; text-shadow: 0 .08em .2em #000; margin-top: .3em; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }

  .leyenda { background: var(--tarjeta); border: 3px solid var(--borde); border-radius: 22px; padding: clamp(10px, 1.8vmin, 22px); display: flex; flex-direction: column; gap: clamp(6px, 1.2vmin, 14px); font-size: clamp(14px, 2.3vmin, 26px); font-weight: 700; }
  .ley-fila { display: flex; align-items: center; gap: 12px; }
  .ley-fila .b { width: 1.5em; height: 1.5em; border-radius: 50%; flex: none; box-shadow: 0 .1em .15em rgba(0,0,0,.7); }
  .b.acero { background: radial-gradient(circle at 32% 30%, #fff 0, #c9ced2 28%, #6d7378 62%, #25282b 100%); }
  .b.roja { background: radial-gradient(circle at 32% 30%, #ffc4c4 0, #ff2a2a 32%, #b00000 64%, #3a0000 100%); }
  .b.dorada { background: radial-gradient(circle at 32% 30%, #fffbd0 0, #ffd34d 30%, #c28a00 64%, #4a3000 100%); }
  .ley-fila .x { margin-left: auto; font-weight: 900; color: var(--acento); }
  .ley-sep { height: 2px; background: var(--borde); }
  .ley-chips { display: flex; justify-content: space-around; gap: 10px; font-weight: 900; font-size: clamp(16px, 2.6vh, 30px); }
  .ley-chips span { display: flex; align-items: center; gap: 6px; }
  .ley-chips i.b { display: inline-block; width: 1.2em; height: 1.2em; border-radius: 50%; box-shadow: 0 .1em .15em rgba(0,0,0,.7); }
  .ley-txt { color: var(--gris); font-weight: 700; line-height: 1.25; text-align: center; font-size: clamp(14px, 2.2vh, 26px); }
  .ley-txt b { color: #fff; }

  @media (orientation: landscape) {
    .juego-grid { grid-template-columns: clamp(220px, 21vw, 420px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .col-izq { gap: clamp(8px, 1.6vh, 20px); }
    .ayuda { display: none; }
    .logo-juego { width: min(100%, 24vh); }
    #puntos { font-size: clamp(40px, 9vh, 130px); }
    .bolas-num { font-size: clamp(32px, 6.6vh, 90px); }
    .boton-soltar { padding: clamp(14px, 3vh, 40px) 10px; font-size: clamp(22px, 4vh, 52px); }
  }
  @media (orientation: portrait) {
    .juego-grid { grid-template-columns: auto 1fr auto; grid-template-rows: auto auto auto auto; align-content: center; row-gap: clamp(14px, 3vmin, 40px);
      grid-template-areas: "salir logo marc" "mesa mesa mesa" "ley ley ley" "bolas boton boton"; }
    .col { display: contents; }
    .salir { grid-area: salir; align-self: center; justify-self: start; }
    .logo-juego { grid-area: logo; width: auto; height: clamp(40px, 8vmin, 110px); }
    .marcador { grid-area: marc; min-width: 28vmin; }
    #puntos { font-size: clamp(36px, 8vmin, 110px); }
    .hueco { grid-area: mesa; aspect-ratio: 1200 / 880; }
    .bolas-card { grid-area: bolas; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    .bolas-num { font-size: clamp(34px, 7vmin, 90px); }
    .zona-soltar { grid-area: boton; display: flex; }
    .boton-soltar { padding: clamp(14px, 2.4vmin, 34px) 12px; }
    .ayuda { display: none; }
    .leyenda { grid-area: ley; flex-direction: row; justify-content: center; align-items: center; gap: 4vmin; }
  }

  #aviso { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,.9); color: #fff; z-index: 10; text-align: center; padding: 24px; }
  #aviso.visible { display: flex; animation: entra .2s ease-out; }
  #aviso .grande { font-size: clamp(38px, 9vmin, 110px); font-weight: 900; color: var(--acento); }
  #aviso .peq { font-size: clamp(20px, 4vmin, 44px); font-weight: 700; }
  #aviso .pts { font-size: clamp(60px, 16vmin, 200px); font-weight: 900; color: var(--oro); line-height: 1; }

  /* ---------- Nombre ---------- */
  .resumen { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vmin, 40px); flex-wrap: wrap; text-align: center; }
  .estrellas { font-size: clamp(26px, 5.5vmin, 60px); letter-spacing: .08em; }
  .puntuacion { font-size: clamp(36px, 9vmin, 100px); font-weight: 900; color: var(--acento); line-height: 1; }
  .mensaje { font-size: clamp(16px, 2.8vmin, 30px); font-weight: 700; flex-basis: 100%; }
  .pide-nombre { text-align: center; font-weight: 800; font-size: clamp(20px, 3.4vmin, 38px); }
  .caja-nombre { background: var(--tarjeta); border: 4px solid var(--acento); border-radius: 20px; min-height: clamp(56px, 10vmin, 110px); display: flex; align-items: center; justify-content: center; font-size: clamp(30px, 6vmin, 66px); font-weight: 900; letter-spacing: .08em; }
  #nombre-valor:empty::before { content: "Tu nombre"; color: #6b6b6b; font-weight: 600; letter-spacing: 0; }
  .cursor { display: inline-block; width: 4px; height: .9em; background: var(--acento); margin-left: 6px; animation: parpadeo 1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  .teclado { flex: 1 1 auto; min-height: clamp(190px, 36vmin, 440px); display: flex; flex-direction: column; gap: clamp(6px, 1.2vmin, 14px); }
  .fila { flex: 1; display: flex; gap: clamp(6px, 1.2vmin, 14px); justify-content: center; }
  .tecla { flex: 1; max-width: 120px; background: var(--tarjeta); border-radius: 14px; font-weight: 800; font-size: clamp(20px, 4vmin, 44px); border: 2px solid var(--borde); }
  .tecla:active { background: var(--acento); color: #fff; transform: scale(.95); }
  .tecla.ancha { flex: 1.6; max-width: 200px; }
  .tecla.espacio { flex: 5; max-width: none; font-size: clamp(16px, 2.6vmin, 28px); letter-spacing: .15em; color: var(--gris); }

  /* ---------- Ranking (20 puestos) ---------- */
  .titulo-ranking { margin: 0; text-align: center; font-size: clamp(26px, 5vmin, 60px); font-weight: 900; }
  .aviso-ranking { text-align: center; font-size: clamp(16px, 2.6vmin, 30px); font-weight: 700; color: var(--acento); min-height: 1.2em; }
  .lista-rank { flex: 1 1 auto; min-height: 0; display: grid; gap: clamp(4px, .9vmin, 10px); grid-template-columns: 1fr; grid-template-rows: repeat(20, minmax(0, 1fr)); overflow: hidden; }
  @media (orientation: landscape) { .lista-rank { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(10, minmax(0, 1fr)); grid-auto-flow: column; column-gap: clamp(10px, 2vmin, 26px); } }
  .fila-rank { display: flex; align-items: center; gap: clamp(8px, 1.6vmin, 18px); background: var(--tarjeta); border-radius: 14px; padding: 0 clamp(10px, 2vmin, 24px); font-size: clamp(15px, 2.7vmin, 30px); font-weight: 800; border: 2px solid transparent; min-height: 0; }
  .fila-rank .pos { width: 2.3em; text-align: center; flex: none; color: var(--gris); }
  .fila-rank .nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila-rank .pts { font-weight: 900; color: var(--acento); flex: none; }
  .fila-rank.libre { background: transparent; border: 2px dashed #262626; color: #4a4a4a; font-weight: 600; }
  .fila-rank.libre .nom { color: #3d3d3d; }
  .fila-rank.top .pos { color: #fff; }
  .fila-rank.nueva { background: #3a0a0a; border-color: var(--acento); animation: latido2 1s ease-out 2; }
  @keyframes latido2 { 50% { box-shadow: 0 0 0 4px rgba(255,0,0,.55); } }
  .borrar-uno { background: #3a1010; color: #ff8a8a; border-radius: 10px; padding: 2px 12px; font-size: .8em; font-weight: 900; flex: none; }
  #borrar-todo, #exportar { display: none; }
  #borrar-todo.visible { display: block; background: #3a1010; border-color: #ff5252; color: #ff8a8a; }
  #exportar.visible { display: block; }

  /* =====================================================
     ESTÉTICA 3D RETRO (arcade de los 80/90)
     ===================================================== */
  .pantalla { z-index: 1; background: transparent; }
  .fondo-retro { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(#000 0%, #0d0000 35%, #2a0000 58%, #000 58.3%); transition: opacity .4s; }
  .fondo-retro.tenue { opacity: .45; }
  .cabecera { position: relative; display: flex; justify-content: center; align-items: flex-end; padding: 15vmin 4vmin 0; }
  .cabecera .titulo-retro { position: relative; }
  .sol { position: absolute; left: 50%; bottom: 35%; width: min(18vmin, 220px); aspect-ratio: 1; border-radius: 50%;
    transform: translateX(-50%);
    background: linear-gradient(#ffd34d 0%, #ff7a00 35%, #ff0000 62%, #8a0000 100%);
    box-shadow: 0 0 8vmin rgba(255,0,0,.55);
    -webkit-mask: linear-gradient(#000 0 50%, transparent 50% 53%, #000 53% 61%, transparent 61% 65%, #000 65% 72%, transparent 72% 77%, #000 77% 83%, transparent 83% 90%, #000 90%);
            mask: linear-gradient(#000 0 50%, transparent 50% 53%, #000 53% 61%, transparent 61% 65%, #000 65% 72%, transparent 72% 77%, #000 77% 83%, transparent 83% 90%, #000 90%); }
  .horizonte { position: absolute; left: 0; right: 0; top: 58%; height: 3px; background: #ff3030; box-shadow: 0 0 18px 4px rgba(255,0,0,.8); }
  .suelo { position: absolute; left: -60%; right: -60%; top: 58%; height: 70%;
    background-image: linear-gradient(rgba(255,0,0,.85) 3px, transparent 3px), linear-gradient(90deg, rgba(255,0,0,.85) 3px, transparent 3px);
    background-size: 70px 70px; transform-origin: top; transform: perspective(260px) rotateX(72deg);
    animation: avanza 1.1s linear infinite;
    -webkit-mask: linear-gradient(transparent, #000 25%); mask: linear-gradient(transparent, #000 25%); }
  @keyframes avanza { to { background-position: 0 70px; } }
  .estrellitas { position: absolute; inset: 0 0 42% 0; background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1.5px 1.5px at 33% 8%, #fff, transparent),
      radial-gradient(1px 1px at 52% 27%, #fff, transparent), radial-gradient(1.5px 1.5px at 71% 12%, #fff, transparent),
      radial-gradient(1px 1px at 86% 32%, #fff, transparent), radial-gradient(1px 1px at 23% 40%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 93% 6%, #fff, transparent), radial-gradient(1px 1px at 6% 52%, #fff, transparent);
    opacity: .7; animation: titila 3s ease-in-out infinite alternate; }
  @keyframes titila { to { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .suelo, .crt, .estrellitas { animation: none; } }

  /* Texto con volumen */
  #inicio .centro { gap: clamp(10px, 2.4vmin, 30px); }
  #inicio .boton-inicio { padding: clamp(14px, 2.6vmin, 36px); font-size: clamp(24px, 4.8vmin, 58px); }
  .titulo-retro { font-size: clamp(50px, 12vmin, 160px); font-weight: 900; font-style: italic; letter-spacing: .05em; line-height: .95; margin: 0;
    background: linear-gradient(#ffffff 0%, #ffd6d6 38%, #ff2020 52%, #a00000 78%, #ff6a6a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .03em 0 #b00000) drop-shadow(0 .03em 0 #800000) drop-shadow(0 .03em 0 #5a0000) drop-shadow(0 .03em 0 #300000) drop-shadow(0 0 .25em rgba(255,0,0,.6));
    transform: perspective(600px) rotateX(16deg); }
  .sub b { color: #ffd34d; }
  .sub { font-style: italic; text-transform: uppercase; letter-spacing: .12em; text-shadow: 3px 3px 0 #5a0000; }
  .logo-inicio { width: min(46vw, 40vmin); filter: drop-shadow(0 4px 0 #5a0000) drop-shadow(0 0 2.4vmin rgba(255,0,0,.45)); }
  .rotulo { font-family: ui-monospace, "Courier New", monospace; letter-spacing: .3em; color: #ff8080; }
  #puntos, .bolas-num, .puntuacion, #aviso .pts { font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; font-weight: 900; }
  #puntos { color: #ff2020; text-shadow: 0 0 .2em rgba(255,0,0,.9), 3px 3px 0 #4a0000; }
  .titulo-ranking, #aviso .grande { font-style: italic; text-transform: uppercase; letter-spacing: .06em; text-shadow: 2px 2px 0 #b00000, 4px 4px 0 #700000, 6px 6px 0 #3a0000, 0 0 .4em rgba(255,0,0,.6); }
  #banner .b1 { font-style: italic; text-shadow: 2px 2px 0 #b00000, 4px 4px 0 #700000, 6px 6px 0 #3a0000, 8px 8px 0 #1a0000, 0 0 .4em rgba(255,0,0,.9); }

  /* Botones de máquina recreativa */
  .boton-inicio, .boton-grande, .boton-soltar { text-transform: uppercase; font-style: italic; letter-spacing: .05em; }
  .boton-inicio { background: linear-gradient(#ff5050, #e00000 50%, #b00000); border: 4px solid #ff8080; box-shadow: 0 1.2vmin 0 #5a0000, 0 2vmin 3vmin rgba(255,0,0,.35); text-shadow: 3px 3px 0 #6a0000; }
  .boton-inicio:active { transform: translateY(1vmin); box-shadow: 0 .2vmin 0 #5a0000; }
  .boton-inicio.secundario { background: rgba(20,0,0,.75); border-color: #ff2020; box-shadow: 0 1.2vmin 0 #3a0000, inset 0 0 2vmin rgba(255,0,0,.25); }
  .boton-grande { box-shadow: 0 7px 0 #5a0000; }
  .boton-grande.secundario { background: rgba(20,0,0,.8); border-color: #5a1010; box-shadow: 0 7px 0 #1a0000; }
  .boton-grande:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 #5a0000; }
  .boton-soltar { text-shadow: 3px 3px 0 #6a0000; }
  .salir { background: rgba(20,0,0,.8); border-color: #5a1010; box-shadow: 0 5px 0 #1a0000; }

  /* Paneles con bisel */
  .marcador, .bolas-card, .leyenda { background: linear-gradient(rgba(40,0,0,.85), rgba(8,0,0,.9)); border: 3px solid #6a0000;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.08), inset 0 -5px 0 rgba(0,0,0,.6), 0 8px 0 #2a0000, 0 0 3vmin rgba(255,0,0,.15); }
  .tecla { background: linear-gradient(#2a0a0a, #140000); border: 2px solid #4a1010; box-shadow: 0 5px 0 #000; }
  .tecla:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  .caja-nombre { background: rgba(10,0,0,.85); box-shadow: 0 0 3vmin rgba(255,0,0,.35), inset 0 0 2vmin rgba(255,0,0,.2); font-family: ui-monospace, "Courier New", monospace; }

/* ---------- Mesa (siempre en horizontal: porterías a izquierda y derecha) ---------- */
const L = 1600, S = 900;                 // largo y ancho de la mesa
const PORTERIA = 300;                    // hueco de cada portería
const RD = 26, RM = 50;                  // radio del disco y de los mazos
const P_ARR = S / 2 - PORTERIA / 2, P_ABA = S / 2 + PORTERIA / 2;
const JUG = [
  { nombre: "ROJO", color: "#ff2a2a", claro: "#ff8a8a", oscuro: "#7a0000", lado: -1 },
  { nombre: "AMARILLO", color: "#ffd34d", claro: "#fff1b0", oscuro: "#7a5a00", lado: 1 }
];

let G = null, pantallaActual = "inicio", temporizador;
let vertical = false;                    // en pantallas verticales la mesa se dibuja girada

function nuevaPartida() {
  G = {
    goles: [0, 0], estado: "listo", reloj: 2.2, terminado: false, t: 0, estela: [],
    disco: { x: L / 2, y: S / 2, vx: 0, vy: 0 },
    mazos: [
      { x: L * .12, y: S / 2, vx: 0, vy: 0, objetivo: null, dedo: null },
      { x: L * .88, y: S / 2, vx: 0, vy: 0, objetivo: null, dedo: null }
    ],
    chispas: [], destello: 0
  };
  pintarTanteo();
  banner("¡PREPARADOS!", `Gana el primero en llegar a ${CONFIG.golesParaGanar}`);
}

function mostrar(id) {
  pantallaActual = id;
  $("#fondo-retro").classList.toggle("tenue", id !== "inicio");
  document.querySelectorAll(".pantalla").forEach(p => p.classList.toggle("activa", p.id === id));
  if (id === "juego") requestAnimationFrame(ajustar);
  reiniciarInactividad();
}

function pintarTanteo(quien) {
  $("#goles1").textContent = G.goles[0]; $("#goles2").textContent = G.goles[1];
  if (quien !== undefined) { const el = $("#goles" + (quien + 1)); el.classList.remove("sube"); void el.offsetWidth; el.classList.add("sube"); }
}
function banner(t1, t2) {
  $("#banner1").textContent = t1; $("#banner2").textContent = t2;
  const b = $("#banner"); b.classList.remove("ver"); void b.offsetWidth; b.classList.add("ver");
}

/* ---------- Dedos: cada uno controla el mazo de su mitad (multitoque) ---------- */
const lienzo = $("#lienzo"), ctx = lienzo.getContext("2d");
function aMesa(e) {
  const r = lienzo.getBoundingClientRect();
  const u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
  return vertical ? { x: (1 - v) * L, y: u * S } : { x: u * L, y: v * S };
}
lienzo.addEventListener("pointerdown", e => {
  iniciarAudio();
  if (!G) return;
  e.preventDefault();
  const p = aMesa(e), j = p.x < L / 2 ? 0 : 1;
  G.mazos[j].dedo = e.pointerId; G.mazos[j].objetivo = p;
  try { lienzo.setPointerCapture(e.pointerId); } catch (x) {}
});
lienzo.addEventListener("pointermove", e => {
  if (!G) return;
  const m = G.mazos.find(m => m.dedo === e.pointerId);
  if (m) m.objetivo = aMesa(e);
});
["pointerup", "pointercancel"].forEach(ev => lienzo.addEventListener(ev, e => {
  if (!G) return;
  G.mazos.forEach(m => { if (m.dedo === e.pointerId) m.dedo = null; });
}));
/* Teclado (para probar): W A S D y flechas */
const teclas = new Set();
addEventListener("keydown", e => { teclas.add(e.key.toLowerCase()); });
addEventListener("keyup", e => { teclas.delete(e.key.toLowerCase()); });
function teclado(dt) {
  const v = 900 * dt;
  [["w", "s", "a", "d"], ["arrowup", "arrowdown", "arrowleft", "arrowright"]].forEach(([ar, ab, iz, de], j) => {
    const m = G.mazos[j];
    const dx = (teclas.has(de) - teclas.has(iz)) * v, dy = (teclas.has(ab) - teclas.has(ar)) * v;
    if (dx || dy) m.objetivo = { x: (m.objetivo || m).x + dx, y: (m.objetivo || m).y + dy };
  });
}

/* ---------- Física ---------- */
function limitarMazo(m, j, p) {
  const minX = j === 0 ? RM : L / 2 + RM, maxX = j === 0 ? L / 2 - RM : L - RM;
  return { x: Math.max(minX, Math.min(maxX, p.x)), y: Math.max(RM, Math.min(S - RM, p.y)) };
}

function actualizar(dt) {
  G.t += dt;
  G.chispas.forEach(c => { c.t += dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .94; c.vy *= .94; });
  G.chispas = G.chispas.filter(c => c.t < c.dur);
  G.destello = Math.max(0, G.destello - dt * 1.5);
  teclado(dt);

  // los mazos siguen al dedo también durante las pausas (para colocarse)
  const pasos = 8, h = dt / pasos;
  const origen = G.mazos.map(m => ({ x: m.x, y: m.y }));
  const destino = G.mazos.map((m, j) => m.objetivo ? limitarMazo(m, j, m.objetivo) : { x: m.x, y: m.y });

  for (let k = 1; k <= pasos; k++) {
    G.mazos.forEach((m, j) => {
      const nx = origen[j].x + (destino[j].x - origen[j].x) * k / pasos, ny = origen[j].y + (destino[j].y - origen[j].y) * k / pasos;
      m.vx = (nx - m.x) / h; m.vy = (ny - m.y) / h; m.x = nx; m.y = ny;
    });
    if (G.estado === "jugando") pasoDisco(h);
  }
  G.mazos.forEach(m => { m.vx *= .5; m.vy *= .5; });

  if (G.estado === "listo" || G.estado === "gol") {
    if ((G.reloj -= dt) <= 0) {
      if (G.estado === "gol" && Math.max(...G.goles) >= CONFIG.golesParaGanar) return finPartida();
      G.estado = "jugando";
    }
  }
}

function pasoDisco(h) {
  const d = G.disco;
  const fr = Math.exp(-CONFIG.rozamiento * h);
  d.vx *= fr; d.vy *= fr;
  d.x += d.vx * h; d.y += d.vy * h;

  // paredes de arriba y abajo
  if (d.y < RD) { d.y = RD; d.vy = Math.abs(d.vy) * CONFIG.reboteParedes; golpePared(); }
  else if (d.y > S - RD) { d.y = S - RD; d.vy = -Math.abs(d.vy) * CONFIG.reboteParedes; golpePared(); }
  // paredes del fondo (fuera de la portería)
  const enPorteria = d.y > P_ARR && d.y < P_ABA;
  if (!enPorteria) {
    if (d.x < RD) { d.x = RD; d.vx = Math.abs(d.vx) * CONFIG.reboteParedes; golpePared(); }
    else if (d.x > L - RD) { d.x = L - RD; d.vx = -Math.abs(d.vx) * CONFIG.reboteParedes; golpePared(); }
  } else {
    // postes de la portería
    for (const px of [0, L]) for (const py of [P_ARR, P_ABA]) {
      const dx = d.x - px, dy = d.y - py, dist = Math.hypot(dx, dy);
      if (dist < RD && dist > 0) {
        const nx = dx / dist, ny = dy / dist; d.x = px + nx * RD; d.y = py + ny * RD;
        const vn = d.vx * nx + d.vy * ny; if (vn < 0) { d.vx -= 1.8 * vn * nx; d.vy -= 1.8 * vn * ny; golpePared(); }
      }
    }
    if (d.x < -RD) return gol(1);
    if (d.x > L + RD) return gol(0);
  }

  // mazos
  for (const m of G.mazos) {
    const dx = d.x - m.x, dy = d.y - m.y, dist = Math.hypot(dx, dy), min = RD + RM;
    if (dist >= min) continue;
    const nx = dist ? dx / dist : 1, ny = dist ? dy / dist : 0;
    d.x = m.x + nx * min; d.y = m.y + ny * min;
    const rvx = d.vx - m.vx, rvy = d.vy - m.vy, vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      d.vx -= (1 + CONFIG.rebote) * vn * nx; d.vy -= (1 + CONFIG.rebote) * vn * ny;
      const imp = -vn;
      if (imp > 120) { sonar.golpe(Math.min(1, imp / 2000)); chispazo(d.x - nx * RD, d.y - ny * RD, Math.min(10, imp / 200), "#ffffff"); }
    }
    // si queda atrapado contra la pared, se escapa por el lado
    if (d.y <= RD + 1 || d.y >= S - RD - 1) d.vx += (d.x > m.x ? 1 : -1) * 60;
  }
  const v = Math.hypot(d.vx, d.vy);
  if (v > CONFIG.velocidadMaxima) { d.vx *= CONFIG.velocidadMaxima / v; d.vy *= CONFIG.velocidadMaxima / v; }
  if (v > 500) { G.estela.push({ x: d.x, y: d.y, t: G.t }); if (G.estela.length > 14) G.estela.shift(); }
}

let ultimoGolpePared = 0;
function golpePared() { const n = performance.now(); if (n - ultimoGolpePared > 60) { ultimoGolpePared = n; sonar.pared(); } }

function gol(quien) {
  G.goles[quien]++;
  pintarTanteo(quien);
  G.estado = "gol"; G.reloj = 1.8; G.destello = 1; G.estela = [];
  const j = JUG[quien];
  const final = G.goles[quien] >= CONFIG.golesParaGanar;
  banner("¡GOL!", final ? `¡${j.nombre} gana la partida!` : `${j.nombre} ${G.goles[0]} – ${G.goles[1]}`.replace(j.nombre, `Punto para ${j.nombre}:`));
  chispazo(quien === 0 ? L : 0, S / 2, 60, j.color);
  sonar.gol();
  // saca el que ha encajado, desde su campo
  const d = G.disco, encaja = 1 - quien;
  d.x = encaja === 0 ? L * .3 : L * .7; d.y = S / 2; d.vx = 0; d.vy = 0;
}

function chispazo(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = 150 + Math.random() * 600;
    G.chispas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col, t: 0, dur: .4 + Math.random() * .6, s: 6 + Math.random() * 8 });
  }
}

function finPartida() {
  G.terminado = true; G.estado = "fin";
  const g = G.goles[0] > G.goles[1] ? 0 : 1, j = JUG[g];
  const t = $("#gana-txt");
  t.textContent = `¡GANA ${j.nombre}!`;
  t.classList.toggle("j2", g === 1);
  $("#resultado-final").innerHTML = `<span class="j1">${G.goles[0]}</span> – <span class="j2">${G.goles[1]}</span>`;
  try { localStorage.setItem("airhockeyPartidas", String((Number(localStorage.getItem("airhockeyPartidas")) || 0) + 1)); } catch (e) {}
  sonar.fin();
  mostrar("final");
}

/* ---------- Dibujo ---------- */
let estatico = null, esc = 1;
function ajustar() {
  const hueco = $("#hueco-air"), mesa = $("#mesa-air"), B = 16;
  const r = hueco.getBoundingClientRect();
  vertical = r.height > r.width * 1.05;
  const asp = vertical ? L / S : S / L;          // alto / ancho en pantalla
  let w = Math.min(r.width - 2 * B, (r.height - 2 * B) / asp);
  w = Math.max(160, w);
  mesa.style.width = (w + 2 * B) + "px"; mesa.style.height = (w * asp + 2 * B) + "px";
  const ancho = vertical ? S : L;
  esc = CONFIG.pixelesMesa / ancho;
  lienzo.width = Math.round(ancho * esc); lienzo.height = Math.round((vertical ? L : S) * esc);
  estatico = document.createElement("canvas"); estatico.width = lienzo.width; estatico.height = lienzo.height;
  const c = estatico.getContext("2d"); transformar(c); dibujarMesa(c);
}
addEventListener("resize", () => { if (pantallaActual === "juego") ajustar(); });
logoImg.addEventListener("load", () => { if (pantallaActual === "juego") ajustar(); });
function transformar(c) {
  if (vertical) c.setTransform(0, -esc, esc, 0, 0, L * esc);       // gira la mesa 90°
  else c.setTransform(esc, 0, 0, esc, 0, 0);
}

function dibujarMesa(c) {
  // superficie
  const g = c.createLinearGradient(0, 0, L, 0);
  g.addColorStop(0, "#2a0000"); g.addColorStop(.5, "#0d0d0d"); g.addColorStop(1, "#2a2000");
  c.fillStyle = g; c.fillRect(0, 0, L, S);
  // agujeros del aire
  c.fillStyle = "rgba(255,255,255,.07)";
  for (let y = 30; y < S; y += 40) for (let x = 30; x < L; x += 40) c.fillRect(x - 2, y - 2, 4, 4);
  // logo en el centro
  if (logoImg.complete && logoImg.naturalWidth) {
    const lw = 260, lh = lw * logoImg.naturalHeight / logoImg.naturalWidth;
    c.globalAlpha = .16; c.drawImage(logoImg, L / 2 - lw / 2, S / 2 - lh / 2, lw, lh); c.globalAlpha = 1;
  }
  // líneas
  c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 6;
  c.beginPath(); c.moveTo(L / 2, 0); c.lineTo(L / 2, S); c.stroke();
  c.beginPath(); c.arc(L / 2, S / 2, 130, 0, 6.2832); c.stroke();
  c.fillStyle = "rgba(255,255,255,.5)"; c.beginPath(); c.arc(L / 2, S / 2, 12, 0, 6.2832); c.fill();
  // áreas de cada jugador
  JUG.forEach((j, i) => {
    const x = i === 0 ? 0 : L;
    c.strokeStyle = j.color; c.globalAlpha = .55; c.lineWidth = 8;
    c.beginPath(); c.arc(x, S / 2, 190, i === 0 ? -Math.PI / 2 : Math.PI / 2, i === 0 ? Math.PI / 2 : Math.PI * 1.5); c.stroke();
    c.globalAlpha = .12; c.fillStyle = j.color; c.font = "italic 900 110px system-ui, Arial"; c.textAlign = "center"; c.textBaseline = "middle";
    c.save(); c.translate(i === 0 ? L * .25 : L * .75, S / 2); c.rotate(vertical ? Math.PI / 2 : (i === 0 ? -Math.PI / 2 : Math.PI / 2)); c.fillText(j.nombre, 0, 0); c.restore();
    c.globalAlpha = 1;
  });
  // borde con volumen
  const B = 14;
  c.fillStyle = "#5a0000"; c.fillRect(0, 0, L, B); c.fillRect(0, S - B, L, B);
  c.fillRect(0, 0, B, P_ARR); c.fillRect(0, P_ABA, B, S - P_ABA); c.fillRect(L - B, 0, B, P_ARR); c.fillRect(L - B, P_ABA, B, S - P_ABA);
  c.fillStyle = "#ff3030"; c.fillRect(0, 0, L, 4); c.fillRect(0, 0, 4, P_ARR); c.fillRect(0, P_ABA, 4, S - P_ABA);
  c.fillStyle = "#2a0000"; c.fillRect(0, S - 4, L, 4); c.fillRect(L - 4, 0, 4, P_ARR); c.fillRect(L - 4, P_ABA, 4, S - P_ABA);
  // porterías
  JUG.forEach((j, i) => {
    const x = i === 0 ? 0 : L - 24;
    c.fillStyle = "#000"; c.fillRect(x, P_ARR, 24, PORTERIA);
    c.fillStyle = j.color; c.fillRect(i === 0 ? 20 : L - 24, P_ARR, 4, PORTERIA);
    c.fillStyle = "#fff"; [P_ARR, P_ABA].forEach(py => { c.fillRect((i === 0 ? 0 : L - 22), py - 8, 22, 16); });
  });
}

function dibujarMazo(c, m, j) {
  const col = JUG[j];
  c.fillStyle = "rgba(0,0,0,.5)"; c.beginPath(); c.arc(m.x + 8, m.y + 12, RM, 0, 6.2832); c.fill();
  c.fillStyle = col.oscuro; c.beginPath(); c.arc(m.x, m.y + 6, RM, 0, 6.2832); c.fill();
  const g = c.createRadialGradient(m.x - RM * .35, m.y - RM * .4, 4, m.x, m.y, RM);
  g.addColorStop(0, col.claro); g.addColorStop(.6, col.color); g.addColorStop(1, col.oscuro);
  c.fillStyle = g; c.beginPath(); c.arc(m.x, m.y, RM, 0, 6.2832); c.fill();
  c.fillStyle = col.oscuro; c.beginPath(); c.arc(m.x, m.y + 4, RM * .45, 0, 6.2832); c.fill();      // empuñadura
  c.fillStyle = col.claro; c.beginPath(); c.arc(m.x, m.y - 2, RM * .4, 0, 6.2832); c.fill();
  c.fillStyle = "rgba(255,255,255,.8)"; c.fillRect(m.x - RM * .3, m.y - RM * .55, RM * .25, 6);
}

function dibujarDisco(c, d) {
  // arandela de acero
  c.fillStyle = "rgba(0,0,0,.55)"; c.beginPath(); c.arc(d.x + 6, d.y + 9, RD, 0, 6.2832); c.fill();
  c.fillStyle = "#3a3d40"; c.beginPath(); c.arc(d.x, d.y + 4, RD, 0, 6.2832); c.fill();
  const g = c.createRadialGradient(d.x - RD * .4, d.y - RD * .4, 2, d.x, d.y, RD);
  g.addColorStop(0, "#ffffff"); g.addColorStop(.5, "#c9ced2"); g.addColorStop(1, "#6d7378");
  c.fillStyle = g; c.beginPath(); c.arc(d.x, d.y, RD, 0, 6.2832); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(d.x, d.y, RD * .38, 0, 6.2832); c.fill();
  c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = 3; c.beginPath(); c.arc(d.x, d.y, RD * .38, 0, 6.2832); c.stroke();
}

function dibujar() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(estatico, 0, 0);
  transformar(ctx);
  if (G.destello > 0) { ctx.fillStyle = `rgba(255,255,255,${.25 * G.destello})`; ctx.fillRect(0, 0, L, S); }
  // estela del disco
  G.estela.forEach((p, i) => { const a = Math.max(0, 1 - (G.t - p.t) * 5); if (a <= 0) return; ctx.fillStyle = `rgba(255,80,80,${.25 * a * i / G.estela.length})`; ctx.beginPath(); ctx.arc(p.x, p.y, RD * .8, 0, 6.2832); ctx.fill(); });
  if (G.estado !== "gol" || G.reloj < 1.2) dibujarDisco(ctx, G.disco);
  G.mazos.forEach((m, j) => dibujarMazo(ctx, m, j));
  G.chispas.forEach(p => { ctx.globalAlpha = Math.max(0, 1 - p.t / p.dur); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); });
  ctx.globalAlpha = 1;
  if (G.estado === "listo") {
    ctx.setTransform(1, 0, 0, 1, 0, 0);     // texto siempre derecho, también con la mesa girada
    const tam = Math.round(lienzo.width * (vertical ? .05 : .025));
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.font = `800 ${tam}px system-ui, Arial`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Pon el dedo en tu mazo", lienzo.width / 2, lienzo.height * (vertical ? .62 : .88));
  }
}

let ultimo = 0;
function bucle(ts) {
  requestAnimationFrame(bucle);
  if (pantallaActual !== "juego" || !G || !estatico) { ultimo = ts; return; }
  const dt = Math.min(.034, (ts - ultimo) / 1000 || 0); ultimo = ts;
  actualizar(dt);
  if (pantallaActual === "juego") dibujar();
}
requestAnimationFrame(bucle);

/* ---------- Sonido ---------- */
let audio = null;
function iniciarAudio() { if (!audio) try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tono(f, dur, tipo = "square", vol = .05, retraso = 0) {
  if (!audio) return;
  try { const t = audio.currentTime + retraso, o = audio.createOscillator(), g = audio.createGain(); o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {}
}
const sonar = {
  golpe(f) { tono(300 + 500 * f, .06, "square", .03 + .04 * f); },
  pared() { tono(180, .05, "triangle", .04); },
  gol() { [523, 659, 784, 1046, 1318].forEach((f, i) => tono(f, .18, "square", .05, i * .09)); },
  fin() { [392, 523, 659, 784, 1046].forEach((f, i) => tono(f, .3, "triangle", .06, i * .15)); }
};

/* ---------- Botones y modo quiosco ---------- */
function empezar() { iniciarAudio(); nuevaPartida(); mostrar("juego"); }
$("#empezar").onclick = empezar;
$("#revancha").onclick = empezar;
$("#fin-inicio").onclick = () => mostrar("inicio");
$("#salir").onclick = () => { G = null; mostrar("inicio"); };

const SELECTOR = "index.html";
function reiniciarInactividad() {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    if (pantallaActual === "inicio") { if (SELECTOR) location.href = SELECTOR; }
    else { G = null; mostrar("inicio"); }
  }, CONFIG.segundosInactividad * 1000);
}
["pointerdown", "pointermove", "keydown"].forEach(e => document.addEventListener(e, () => { if (e !== "pointermove" || pantallaActual === "juego") reiniciarInactividad(); }, { passive: true }));
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());
$("#pantalla-completa").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
reiniciarInactividad();
window.__air = { get G() { return G; }, actualizar, L, S, RD, RM, mostrar };

</script>
