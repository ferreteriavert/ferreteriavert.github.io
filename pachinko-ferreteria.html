<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pachinko Ferretería Vert</title>
<style>
  :root {
    --fondo: #000000;
    --tinta: #ffffff;
    --tarjeta: #171717;
    --borde: #2e2e2e;
    --gris: #a3a3a3;
    --acento: #ff0000;
    --ok: #3ddc84;
    --oro: #ffd34d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--fondo); color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }

  .pantalla { display: none; height: 100%; padding: clamp(16px, 3vmin, 40px); flex-direction: column; gap: clamp(12px, 2.2vmin, 26px); overflow: hidden; position: relative; }
  .pantalla > * { flex-shrink: 0; }
  .pantalla.activa { display: flex; animation: entra .25s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .boton-grande { background: var(--acento); border: 3px solid var(--acento); color: #fff; border-radius: 20px; padding: clamp(14px, 2.4vmin, 26px); font-weight: 800; font-size: clamp(20px, 3.4vmin, 36px); }
  .boton-grande.secundario { background: var(--tarjeta); color: var(--tinta); border: 3px solid var(--borde); }
  .boton-grande:active:not(:disabled) { transform: scale(.98); }
  .boton-grande:disabled { opacity: .35; }
  .botones-fila { display: flex; gap: clamp(10px, 2vmin, 22px); }
  .botones-fila > button { flex: 1; }

  /* ---------- Inicio ---------- */
  .centro { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 4vmin, 48px); }
  .logo { display: block; height: auto; }
  .logo-inicio { width: min(74vw, 84vmin); }
  .logo-peq { height: clamp(40px, 8vmin, 100px); width: auto; margin: 0 auto; }
  .sub { margin: 0; text-align: center; font-size: clamp(22px, 4vmin, 44px); font-weight: 800; }
  .sub b { color: var(--acento); }
  .botones-inicio { display: flex; flex-direction: column; gap: clamp(14px, 2.6vmin, 30px); width: min(760px, 100%); }
  .boton-inicio { background: var(--acento); border: 4px solid var(--acento); color: #fff; border-radius: 28px; padding: clamp(20px, 3.6vmin, 44px); font-weight: 900; font-size: clamp(28px, 5.2vmin, 64px); }
  .boton-inicio.secundario { background: transparent; }
  .boton-inicio:active { transform: scale(.97); }
  #pantalla-completa { position: absolute; top: 12px; right: 12px; background: transparent; font-size: 28px; opacity: .45; padding: 8px 12px; z-index: 5; }

  /* ---------- Juego ---------- */
  #juego { padding: clamp(10px, 1.8vmin, 26px); gap: 0; }
  .juego-grid { flex: 1 1 auto; min-height: 0; display: grid; gap: clamp(10px, 1.8vmin, 26px); }
  .col { display: flex; flex-direction: column; gap: clamp(10px, 1.8vmin, 22px); min-height: 0; }
  .col-izq { justify-content: space-between; }
  .salir { align-self: flex-start; background: var(--tarjeta); border-radius: 999px; padding: 10px 22px; font-weight: 700; font-size: clamp(15px, 2.4vmin, 24px); border: 2px solid var(--borde); }
  .logo-juego { width: min(100%, 38vmin); margin: 0 auto; }
  .rotulo { font-size: clamp(13px, 2.1vmin, 22px); font-weight: 800; letter-spacing: .18em; color: var(--gris); text-align: center; }
  .marcador { background: var(--tarjeta); border: 3px solid var(--borde); border-radius: 22px; padding: clamp(8px, 1.6vmin, 18px) 12px; text-align: center; }
  #puntos { font-size: clamp(44px, 11vmin, 150px); font-weight: 900; color: var(--acento); line-height: 1; font-variant-numeric: tabular-nums; }
  #puntos.sube { animation: latido .35s ease-out; }
  @keyframes latido { 40% { transform: scale(1.12); color: #fff; } }
  .bolas-card { background: var(--tarjeta); border: 3px solid var(--borde); border-radius: 22px; padding: clamp(8px, 1.6vmin, 18px) 12px; text-align: center; position: relative; }
  .bolas-num { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: clamp(34px, 8vmin, 100px); font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .bola-ico { width: .7em; height: .7em; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #fff 0, #c9ced2 28%, #6d7378 62%, #25282b 100%); box-shadow: 0 .08em .12em rgba(0,0,0,.7); }
  #extra { position: absolute; right: 16px; top: 8px; font-weight: 900; color: var(--ok); font-size: clamp(18px, 3.4vmin, 40px); opacity: 0; }
  #extra.ver { animation: extra 1.4s ease-out; }
  @keyframes extra { 0% { opacity: 0; transform: translateY(14px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }

  .boton-soltar { background: linear-gradient(#ff3b3b, #d80000 55%, #a40000); border: 4px solid #ff6a6a; color: #fff; border-radius: 28px; padding: clamp(18px, 3.4vmin, 44px) 12px; font-weight: 900; font-size: clamp(24px, 4.6vmin, 58px); letter-spacing: .04em; box-shadow: 0 .5vmin 0 #6a0000, 0 1.6vmin 3vmin rgba(255,0,0,.35); }
  .boton-soltar:active:not(:disabled) { transform: translateY(.5vmin); box-shadow: 0 0 0 #6a0000, 0 .6vmin 1.4vmin rgba(255,0,0,.3); }
  .boton-soltar:disabled { filter: grayscale(.8) brightness(.55); }
  .ayuda { text-align: center; color: var(--gris); font-size: clamp(13px, 2vmin, 21px); font-weight: 600; margin-top: -4px; }

  .hueco { position: relative; min-width: 0; min-height: 0; perspective: 1500px; }
  .mesa { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotateX(14deg); background: #000; border: clamp(8px, 1.4vmin, 18px) solid #2a0505; border-radius: 22px; box-shadow: 0 0 0 3px var(--acento), 0 1.4vmin 0 3px #5a0000, 0 3vmin 0 3px #2a0000, 0 6vmin 7vmin rgba(0,0,0,.95), 0 0 6vmin rgba(255,0,0,.35); overflow: hidden; }
  #lienzo { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .cristal { position: absolute; inset: 0; pointer-events: none; background:
      linear-gradient(112deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.075) 30%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 52%, rgba(255,255,255,.05) 58%, rgba(255,255,255,0) 64%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%); }
  #banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; z-index: 4; width: 96%; }
  #banner.ver { animation: banner 2.4s ease-out; }
  #banner .b1 { font-size: clamp(30px, 8vmin, 96px); font-weight: 900; color: var(--oro); text-shadow: 0 0 .4em rgba(255,0,0,.9), 0 .06em 0 #7a0000, 0 .12em .3em rgba(0,0,0,.9); line-height: 1.05; }
  #banner .b2 { font-size: clamp(18px, 4vmin, 48px); font-weight: 800; color: #fff; text-shadow: 0 .08em .2em #000; margin-top: .3em; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }

  .leyenda { background: var(--tarjeta); border: 3px solid var(--borde); border-radius: 22px; padding: clamp(10px, 1.8vmin, 22px); display: flex; flex-direction: column; gap: clamp(6px, 1.2vmin, 14px); font-size: clamp(14px, 2.3vmin, 26px); font-weight: 700; }
  .ley-fila { display: flex; align-items: center; gap: 12px; }
  .ley-fila .b { width: 1.5em; height: 1.5em; border-radius: 50%; flex: none; box-shadow: 0 .1em .15em rgba(0,0,0,.7); }
  .b.acero { background: radial-gradient(circle at 32% 30%, #fff 0, #c9ced2 28%, #6d7378 62%, #25282b 100%); }
  .b.roja { background: radial-gradient(circle at 32% 30%, #ffc4c4 0, #ff2a2a 32%, #b00000 64%, #3a0000 100%); }
  .b.dorada { background: radial-gradient(circle at 32% 30%, #fffbd0 0, #ffd34d 30%, #c28a00 64%, #4a3000 100%); }
  .ley-fila .x { margin-left: auto; font-weight: 900; color: var(--acento); }
  .ley-sep { height: 2px; background: var(--borde); }
  .ley-chips { display: flex; justify-content: space-around; gap: 10px; font-weight: 900; font-size: clamp(16px, 2.6vh, 30px); }
  .ley-chips span { display: flex; align-items: center; gap: 6px; }
  .ley-chips i.b { display: inline-block; width: 1.2em; height: 1.2em; border-radius: 50%; box-shadow: 0 .1em .15em rgba(0,0,0,.7); }
  .ley-txt { color: var(--gris); font-weight: 700; line-height: 1.25; text-align: center; font-size: clamp(14px, 2.2vh, 26px); }
  .ley-txt b { color: #fff; }

  @media (orientation: landscape) {
    .juego-grid { grid-template-columns: clamp(220px, 21vw, 420px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .col-izq { gap: clamp(8px, 1.6vh, 20px); }
    .ayuda { display: none; }
    .logo-juego { width: min(100%, 24vh); }
    #puntos { font-size: clamp(40px, 9vh, 130px); }
    .bolas-num { font-size: clamp(32px, 6.6vh, 90px); }
    .boton-soltar { padding: clamp(14px, 3vh, 40px) 10px; font-size: clamp(22px, 4vh, 52px); }
  }
  @media (orientation: portrait) {
    .juego-grid { grid-template-columns: auto 1fr auto; grid-template-rows: auto auto auto auto; align-content: center; row-gap: clamp(14px, 3vmin, 40px);
      grid-template-areas: "salir logo marc" "mesa mesa mesa" "ley ley ley" "bolas boton boton"; }
    .col { display: contents; }
    .salir { grid-area: salir; align-self: center; justify-self: start; }
    .logo-juego { grid-area: logo; width: auto; height: clamp(40px, 8vmin, 110px); }
    .marcador { grid-area: marc; min-width: 28vmin; }
    #puntos { font-size: clamp(36px, 8vmin, 110px); }
    .hueco { grid-area: mesa; aspect-ratio: 1200 / 880; }
    .bolas-card { grid-area: bolas; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    .bolas-num { font-size: clamp(34px, 7vmin, 90px); }
    .zona-soltar { grid-area: boton; display: flex; }
    .boton-soltar { padding: clamp(14px, 2.4vmin, 34px) 12px; }
    .ayuda { display: none; }
    .leyenda { grid-area: ley; flex-direction: row; justify-content: center; align-items: center; gap: 4vmin; }
  }

  #aviso { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,.9); color: #fff; z-index: 10; text-align: center; padding: 24px; }
  #aviso.visible { display: flex; animation: entra .2s ease-out; }
  #aviso .grande { font-size: clamp(38px, 9vmin, 110px); font-weight: 900; color: var(--acento); }
  #aviso .peq { font-size: clamp(20px, 4vmin, 44px); font-weight: 700; }
  #aviso .pts { font-size: clamp(60px, 16vmin, 200px); font-weight: 900; color: var(--oro); line-height: 1; }

  /* ---------- Nombre ---------- */
  .resumen { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vmin, 40px); flex-wrap: wrap; text-align: center; }
  .estrellas { font-size: clamp(26px, 5.5vmin, 60px); letter-spacing: .08em; }
  .puntuacion { font-size: clamp(36px, 9vmin, 100px); font-weight: 900; color: var(--acento); line-height: 1; }
  .mensaje { font-size: clamp(16px, 2.8vmin, 30px); font-weight: 700; flex-basis: 100%; }
  .pide-nombre { text-align: center; font-weight: 800; font-size: clamp(20px, 3.4vmin, 38px); }
  .caja-nombre { background: var(--tarjeta); border: 4px solid var(--acento); border-radius: 20px; min-height: clamp(56px, 10vmin, 110px); display: flex; align-items: center; justify-content: center; font-size: clamp(30px, 6vmin, 66px); font-weight: 900; letter-spacing: .08em; }
  #nombre-valor:empty::before { content: "Tu nombre"; color: #6b6b6b; font-weight: 600; letter-spacing: 0; }
  .cursor { display: inline-block; width: 4px; height: .9em; background: var(--acento); margin-left: 6px; animation: parpadeo 1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  .teclado { flex: 1 1 auto; min-height: clamp(190px, 36vmin, 440px); display: flex; flex-direction: column; gap: clamp(6px, 1.2vmin, 14px); }
  .fila { flex: 1; display: flex; gap: clamp(6px, 1.2vmin, 14px); justify-content: center; }
  .tecla { flex: 1; max-width: 120px; background: var(--tarjeta); border-radius: 14px; font-weight: 800; font-size: clamp(20px, 4vmin, 44px); border: 2px solid var(--borde); }
  .tecla:active { background: var(--acento); color: #fff; transform: scale(.95); }
  .tecla.ancha { flex: 1.6; max-width: 200px; }
  .tecla.espacio { flex: 5; max-width: none; font-size: clamp(16px, 2.6vmin, 28px); letter-spacing: .15em; color: var(--gris); }

  /* ---------- Ranking (20 puestos) ---------- */
  .titulo-ranking { margin: 0; text-align: center; font-size: clamp(26px, 5vmin, 60px); font-weight: 900; }
  .aviso-ranking { text-align: center; font-size: clamp(16px, 2.6vmin, 30px); font-weight: 700; color: var(--acento); min-height: 1.2em; }
  .lista-rank { flex: 1 1 auto; min-height: 0; display: grid; gap: clamp(4px, .9vmin, 10px); grid-template-columns: 1fr; grid-template-rows: repeat(20, minmax(0, 1fr)); overflow: hidden; }
  @media (orientation: landscape) { .lista-rank { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(10, minmax(0, 1fr)); grid-auto-flow: column; column-gap: clamp(10px, 2vmin, 26px); } }
  .fila-rank { display: flex; align-items: center; gap: clamp(8px, 1.6vmin, 18px); background: var(--tarjeta); border-radius: 14px; padding: 0 clamp(10px, 2vmin, 24px); font-size: clamp(15px, 2.7vmin, 30px); font-weight: 800; border: 2px solid transparent; min-height: 0; }
  .fila-rank .pos { width: 2.3em; text-align: center; flex: none; color: var(--gris); }
  .fila-rank .nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila-rank .pts { font-weight: 900; color: var(--acento); flex: none; }
  .fila-rank.libre { background: transparent; border: 2px dashed #262626; color: #4a4a4a; font-weight: 600; }
  .fila-rank.libre .nom { color: #3d3d3d; }
  .fila-rank.top .pos { color: #fff; }
  .fila-rank.nueva { background: #3a0a0a; border-color: var(--acento); animation: latido2 1s ease-out 2; }
  @keyframes latido2 { 50% { box-shadow: 0 0 0 4px rgba(255,0,0,.55); } }
  .borrar-uno { background: #3a1010; color: #ff8a8a; border-radius: 10px; padding: 2px 12px; font-size: .8em; font-weight: 900; flex: none; }
  #borrar-todo, #exportar { display: none; }
  #borrar-todo.visible { display: block; background: #3a1010; border-color: #ff5252; color: #ff8a8a; }
  #exportar.visible { display: block; }

  /* =====================================================
     ESTÉTICA 3D RETRO (arcade de los 80/90)
     ===================================================== */
  .pantalla { z-index: 1; background: transparent; }
  .fondo-retro { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(#000 0%, #0d0000 35%, #2a0000 58%, #000 58.3%); transition: opacity .4s; }
  .fondo-retro.tenue { opacity: .45; }
  .cabecera { position: relative; display: flex; justify-content: center; align-items: flex-end; padding: 15vmin 4vmin 0; }
  .cabecera .titulo-retro { position: relative; }
  .sol { position: absolute; left: 50%; bottom: 35%; width: min(18vmin, 220px); aspect-ratio: 1; border-radius: 50%;
    transform: translateX(-50%);
    background: linear-gradient(#ffd34d 0%, #ff7a00 35%, #ff0000 62%, #8a0000 100%);
    box-shadow: 0 0 8vmin rgba(255,0,0,.55);
    -webkit-mask: linear-gradient(#000 0 50%, transparent 50% 53%, #000 53% 61%, transparent 61% 65%, #000 65% 72%, transparent 72% 77%, #000 77% 83%, transparent 83% 90%, #000 90%);
            mask: linear-gradient(#000 0 50%, transparent 50% 53%, #000 53% 61%, transparent 61% 65%, #000 65% 72%, transparent 72% 77%, #000 77% 83%, transparent 83% 90%, #000 90%); }
  .horizonte { position: absolute; left: 0; right: 0; top: 58%; height: 3px; background: #ff3030; box-shadow: 0 0 18px 4px rgba(255,0,0,.8); }
  .suelo { position: absolute; left: -60%; right: -60%; top: 58%; height: 70%;
    background-image: linear-gradient(rgba(255,0,0,.85) 3px, transparent 3px), linear-gradient(90deg, rgba(255,0,0,.85) 3px, transparent 3px);
    background-size: 70px 70px; transform-origin: top; transform: perspective(260px) rotateX(72deg);
    animation: avanza 1.1s linear infinite;
    -webkit-mask: linear-gradient(transparent, #000 25%); mask: linear-gradient(transparent, #000 25%); }
  @keyframes avanza { to { background-position: 0 70px; } }
  .estrellitas { position: absolute; inset: 0 0 42% 0; background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1.5px 1.5px at 33% 8%, #fff, transparent),
      radial-gradient(1px 1px at 52% 27%, #fff, transparent), radial-gradient(1.5px 1.5px at 71% 12%, #fff, transparent),
      radial-gradient(1px 1px at 86% 32%, #fff, transparent), radial-gradient(1px 1px at 23% 40%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 93% 6%, #fff, transparent), radial-gradient(1px 1px at 6% 52%, #fff, transparent);
    opacity: .7; animation: titila 3s ease-in-out infinite alternate; }
  @keyframes titila { to { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .suelo, .crt, .estrellitas { animation: none; } }

  /* Texto con volumen */
  #inicio .centro { gap: clamp(10px, 2.4vmin, 30px); }
  #inicio .boton-inicio { padding: clamp(14px, 2.6vmin, 36px); font-size: clamp(24px, 4.8vmin, 58px); }
  .titulo-retro { font-size: clamp(50px, 12vmin, 160px); font-weight: 900; font-style: italic; letter-spacing: .05em; line-height: .95; margin: 0;
    background: linear-gradient(#ffffff 0%, #ffd6d6 38%, #ff2020 52%, #a00000 78%, #ff6a6a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .03em 0 #b00000) drop-shadow(0 .03em 0 #800000) drop-shadow(0 .03em 0 #5a0000) drop-shadow(0 .03em 0 #300000) drop-shadow(0 0 .25em rgba(255,0,0,.6));
    transform: perspective(600px) rotateX(16deg); }
  .sub b { color: #ffd34d; }
  .sub { font-style: italic; text-transform: uppercase; letter-spacing: .12em; text-shadow: 3px 3px 0 #5a0000; }
  .logo-inicio { width: min(46vw, 40vmin); filter: drop-shadow(0 4px 0 #5a0000) drop-shadow(0 0 2.4vmin rgba(255,0,0,.45)); }
  .rotulo { font-family: ui-monospace, "Courier New", monospace; letter-spacing: .3em; color: #ff8080; }
  #puntos, .bolas-num, .puntuacion, #aviso .pts { font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; font-weight: 900; }
  #puntos { color: #ff2020; text-shadow: 0 0 .2em rgba(255,0,0,.9), 3px 3px 0 #4a0000; }
  .titulo-ranking, #aviso .grande { font-style: italic; text-transform: uppercase; letter-spacing: .06em; text-shadow: 2px 2px 0 #b00000, 4px 4px 0 #700000, 6px 6px 0 #3a0000, 0 0 .4em rgba(255,0,0,.6); }
  #banner .b1 { font-style: italic; text-shadow: 2px 2px 0 #b00000, 4px 4px 0 #700000, 6px 6px 0 #3a0000, 8px 8px 0 #1a0000, 0 0 .4em rgba(255,0,0,.9); }

  /* Botones de máquina recreativa */
  .boton-inicio, .boton-grande, .boton-soltar { text-transform: uppercase; font-style: italic; letter-spacing: .05em; }
  .boton-inicio { background: linear-gradient(#ff5050, #e00000 50%, #b00000); border: 4px solid #ff8080; box-shadow: 0 1.2vmin 0 #5a0000, 0 2vmin 3vmin rgba(255,0,0,.35); text-shadow: 3px 3px 0 #6a0000; }
  .boton-inicio:active { transform: translateY(1vmin); box-shadow: 0 .2vmin 0 #5a0000; }
  .boton-inicio.secundario { background: rgba(20,0,0,.75); border-color: #ff2020; box-shadow: 0 1.2vmin 0 #3a0000, inset 0 0 2vmin rgba(255,0,0,.25); }
  .boton-grande { box-shadow: 0 7px 0 #5a0000; }
  .boton-grande.secundario { background: rgba(20,0,0,.8); border-color: #5a1010; box-shadow: 0 7px 0 #1a0000; }
  .boton-grande:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 #5a0000; }
  .boton-soltar { text-shadow: 3px 3px 0 #6a0000; }
  .salir { background: rgba(20,0,0,.8); border-color: #5a1010; box-shadow: 0 5px 0 #1a0000; }

  /* Paneles con bisel */
  .marcador, .bolas-card, .leyenda { background: linear-gradient(rgba(40,0,0,.85), rgba(8,0,0,.9)); border: 3px solid #6a0000;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.08), inset 0 -5px 0 rgba(0,0,0,.6), 0 8px 0 #2a0000, 0 0 3vmin rgba(255,0,0,.15); }
  .tecla { background: linear-gradient(#2a0a0a, #140000); border: 2px solid #4a1010; box-shadow: 0 5px 0 #000; }
  .tecla:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  .caja-nombre { background: rgba(10,0,0,.85); box-shadow: 0 0 3vmin rgba(255,0,0,.35), inset 0 0 2vmin rgba(255,0,0,.2); font-family: ui-monospace, "Courier New", monospace; }

<div class="fondo-retro" id="fondo-retro"><div class="estrellitas"></div><div class="suelo"></div><div class="horizonte"></div></div>

<!-- ================= INICIO ================= -->
<section class="pantalla activa" id="inicio">
  <a id="volver-juegos" href="index.html">← Juegos</a>
  <button id="pantalla-completa" aria-label="Pantalla completa">⛶</button>
  <div class="centro">
    <img class="logo logo-inicio" alt="Ferretería Vert, fundada el 1846">
    <div class="cabecera"><div class="sol"></div><h1 class="titulo-retro">PACHINKO</h1></div>
    <p class="sub">Aquí manda la <b>suerte</b></p>
    <div class="botones-inicio">
      <button class="boton-inicio" id="empezar">▶ Jugar</button>
      <button class="boton-inicio secundario" id="ver-ranking">🏆 Ver ranking</button>
    </div>
  </div>
</section>

<!-- ================= JUEGO ================= -->
<section class="pantalla" id="juego">
  <div class="juego-grid" id="grid">
    <div class="col col-izq">
      <button class="salir" id="salir">✕ Salir</button>
      <img class="logo logo-juego" alt="Ferretería Vert">
      <div class="marcador"><div class="rotulo">PUNTOS</div><div id="puntos">0</div></div>
      <div class="bolas-card"><div class="rotulo">BOLAS</div><div class="bolas-num"><span class="bola-ico"></span>×<span id="bolas">10</span></div><div id="extra"></div></div>
      <div class="leyenda">
        <div class="ley-chips"><span><i class="b acero"></i>×1</span><span><i class="b roja"></i>×2</span><span><i class="b dorada"></i>×5</span></div>
        <div class="ley-txt">Tuerca central: <b>+1 bola</b></div>
      </div>
      <div class="zona-soltar">
        <button class="boton-soltar" id="soltar" style="width:100%">SOLTAR BOLA</button>
        <div class="ayuda">Toca el tablero para elegir por dónde cae</div>
      </div>
    </div>

    <div class="hueco" id="hueco">
      <div class="mesa-base" id="mesa-base"></div>
      <div class="mesa" id="mesa">
        <canvas id="lienzo"></canvas>

/* Almacenamiento en el propio dispositivo (con plan B si el navegador lo bloquea) */
const mem = {};
const guardar = {
  get(k, def) {
    try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch (e) {}
    return k in mem ? mem[k] : def;
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
};
const CLAVE_RANKING = "pachinkoRanking";

/* =====================================================
   MUNDO FÍSICO (600 × 900 unidades)
   ===================================================== */
const W = 1200, H = 800, R = 10, PEG_R = 5;   // tablero apaisado
const ASP = H / W;
const NC = CONFIG.premiosCasillas.length, SW = W / NC;
const DIV_Y0 = 700, LAND_Y = 762;
const NUT = { x: 600, y: 470, cap: 11 };
const BUMPERS = [
  { x: 230, y: 260, r: 22, p: 0 }, { x: 600, y: 225, r: 22, p: 0 }, { x: 970, y: 260, r: 22, p: 0 },
  { x: 410, y: 370, r: 22, p: 0 }, { x: 790, y: 370, r: 22, p: 0 },
  { x: 250, y: 560, r: 22, p: 0 }, { x: 950, y: 560, r: 22, p: 0 }
];
const POCKETS = [{ x: 46, y: 420, r: 12 }, { x: 1154, y: 420, r: 12 }];
const pegs = [];
const grid = new Map();
const CELL = 32;
(function construir() {
  for (let i = 0, y = 140; y <= 650; i++, y += 39) {      // 14 filas de clavos
    for (let x = (i % 2 ? 54 : 27); x <= W - 27; x += 54) {
      if (BUMPERS.some(b => Math.hypot(x - b.x, y - b.y) < b.r + 36)) continue;
      if (Math.hypot(x - NUT.x, y - NUT.y) < 64) continue;
      if (POCKETS.some(p => Math.hypot(x - p.x, y - p.y) < 46)) continue;
      pegs.push({ x, y, r: PEG_R });
    }
  }
  pegs.push({ x: NUT.x - CONFIG.copa, y: NUT.y - 14, r: 7, poste: true });
  pegs.push({ x: NUT.x + CONFIG.copa, y: NUT.y - 14, r: 7, poste: true });
  pegs.forEach(p => {
    const k = Math.floor(p.x / CELL) + Math.floor(p.y / CELL) * 64;
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(p);
  });
})();

const DT = 1 / 240;
let bolaId = 0;
function nuevaBola(x, tipo, rnd = Math.random) {
  return { id: ++bolaId, x, y: 44, vx: (rnd() - .5) * 60, vy: 0, tipo: tipo.id, mult: tipo.mult, t: 0, lento: 0, fin: false };
}
function sortearTipo(rnd = Math.random) {
  let r = rnd();
  for (const t of CONFIG.bolas) { if ((r -= t.p) < 0) return t; }
  return CONFIG.bolas[0];
}

/* Un paso de física para una bola. `ev` recibe los sucesos. */
function paso(b, ev, rnd = Math.random) {
  const dt = DT;
  b.t += dt;
  b.vy += CONFIG.gravedad * dt;
  const d = Math.exp(-CONFIG.rozamiento * dt);
  b.vx *= d; b.vy *= d;
  b.x += b.vx * dt; b.y += b.vy * dt;

  // paredes
  if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx) * .6; }
  else if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx) * .6; }

  // clavos
  const cx = Math.floor(b.x / CELL), cy = Math.floor(b.y / CELL);
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const lista = grid.get((cx + i) + (cy + j) * 64);
    if (!lista) continue;
    for (const p of lista) {
      const dx = b.x - p.x, dy = b.y - p.y, min = R + p.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= min * min) continue;
      const dist = Math.sqrt(d2) || 0.001, nx = dx / dist, ny = dy / dist;
      b.x = p.x + nx * min; b.y = p.y + ny * min;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        const k = (1 + CONFIG.rebote) * vn;
        b.vx -= k * nx; b.vy -= k * ny;
        const a = (rnd() - .5) * CONFIG.azar * (-vn > 30 ? 1 : .4);
        const c = Math.cos(a), s = Math.sin(a), vx = b.vx, vy = b.vy;
        b.vx = vx * c - vy * s; b.vy = vx * s + vy * c;
        b.vx *= .99;
        if (ev) ev.golpe(b, -vn);
      }
    }
  }

  // arandelas (bumpers)
  for (const m of BUMPERS) {
    const dx = b.x - m.x, dy = b.y - m.y, min = R + m.r;
    const d2 = dx * dx + dy * dy;
    if (d2 >= min * min) continue;
    const dist = Math.sqrt(d2) || 0.001, nx = dx / dist, ny = dy / dist;
    b.x = m.x + nx * min; b.y = m.y + ny * min;
    const sp = Math.max(Math.hypot(b.vx, b.vy) * 1.05, 330);
    const ang = Math.atan2(ny, nx) + (rnd() - .5) * 0.7;
    b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
    m.p = 1;
    if (ev) ev.arandela(b, m);
  }

  // divisores de las casillas
  if (b.y > DIV_Y0 - R) {
    for (let i = 1; i < NC; i++) {
      const x = i * SW;
      const qx = Math.max(x - 3, Math.min(b.x, x + 3)), qy = Math.max(DIV_Y0, Math.min(b.y, H));
      const dx = b.x - qx, dy = b.y - qy;
      const d2 = dx * dx + dy * dy;
      if (d2 >= R * R) continue;
      const dist = Math.sqrt(d2) || 0.001, nx = dx / dist, ny = dy / dist;
      b.x += nx * (R - dist); b.y += ny * (R - dist);
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny; }
      if (Math.abs(ny) > .8) b.vx += (rnd() - .5) * 90;   // evita quedarse en equilibrio sobre un divisor
    }
  }

  // sensores
  if (Math.hypot(b.x - NUT.x, b.y - NUT.y) < NUT.cap) { b.fin = true; ev && ev.tuerca(b); return; }
  for (const p of POCKETS) {
    if (Math.hypot(b.x - p.x, b.y - p.y) < p.r - 1) { b.fin = true; ev && ev.bolsillo(b, p); return; }
  }
  if (b.y >= LAND_Y) {
    b.fin = true;
    ev && ev.casilla(b, Math.max(0, Math.min(NC - 1, Math.floor(b.x / SW))));
    return;
  }

  // anti-atasco
  if (Math.hypot(b.vx, b.vy) < 14) {
    b.lento += dt;
    if (b.lento > .5) { b.vx += (rnd() - .5) * 220; b.vy -= 60; b.lento = 0; }
  } else b.lento = 0;
  if (b.t > 90) { b.y = LAND_Y; }
}

/* Simulación sin dibujar (para afinar el reparto de premios) */
function simular(n, rnd = Math.random) {
  const res = { casillas: new Array(NC).fill(0), bolsillo: 0, tuerca: 0, tiempos: [] };
  for (let i = 0; i < n; i++) {
    const b = nuevaBola(50 + rnd() * (W - 100), CONFIG.bolas[0], rnd);
    const ev = {
      golpe() {}, arandela() {},
      tuerca() { res.tuerca++; }, bolsillo() { res.bolsillo++; },
      casilla(_, idx) { res.casillas[idx]++; }
    };
    let guard = 0;
    while (!b.fin && guard++ < 240 * 120) paso(b, ev, rnd);
    res.tiempos.push(b.t);
  }
  return res;
}

/* =====================================================
   SONIDO (muy discreto, se puede silenciar)
   ===================================================== */
let audio = null, ultimoTic = 0;
function iniciarAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function tono(f, dur = .08, tipo = "sine", vol = .05, retraso = 0) {
  if (!audio || guardar.get("pachinkoMudo", false)) return;
  try {
    const t = audio.currentTime + retraso;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const sonar = {
  tic() { const n = performance.now(); if (n - ultimoTic < 45) return; ultimoTic = n; tono(1500 + Math.random() * 900, .03, "triangle", .018); },
  arandela() { tono(520, .12, "square", .04); tono(780, .1, "square", .03, .05); },
  casilla(v) { tono(v >= 100 ? 880 : 440, .18, "triangle", .06); if (v >= 100) tono(1320, .25, "triangle", .05, .08); },
  gira() { tono(300 + Math.random() * 200, .05, "square", .02); },
  para() { tono(660, .1, "square", .05); },
  gana() { [523, 659, 784, 1046].forEach((f, i) => tono(f, .22, "triangle", .06, i * .12)); },
  suelta() { tono(260, .08, "sine", .05); }
};

let G = null;               // partida en curso

function mostrar(id) {

  document.querySelectorAll(".pantalla").forEach(p => p.classList.toggle("activa", p.id === id));

function iniciar() {
  vieneDeJuego = true;
  G = {
    token: Math.random(), bolas: CONFIG.bolasIniciales, puntos: 0, activas: [],
    lanzando: false, terminado: false, elegido: W / 2, apuntado: false, tolva: { x: W / 2, objetivo: W / 2, estado: "reposo", tipo: CONFIG.bolas[0], espera: 0 },

/* Base del tablero (volumen y brillo) pintada una sola vez */
function pintarBase(base, w, h) {
  let cv = base.querySelector("canvas");
  if (!cv) { cv = document.createElement("canvas"); base.appendChild(cv); }
  const vm = Math.min(innerWidth, innerHeight) / 100, prof = 1.4 * vm, brillo = 6 * vm, pad = Math.ceil(brillo * 1.6);
  cv.width = Math.ceil(w + 2 * pad); cv.height = Math.ceil(h + 2 * pad + 2 * prof);
  Object.assign(cv.style, { left: -pad + "px", top: -pad + "px", width: cv.width + "px", height: cv.height + "px" });
  const c = cv.getContext("2d"), s = 4, k = 4;
  const L = []; for (let j = 0; j < k; j++) L.push([j * s, (k - j) * s], [(j + 1) * s, (k - j) * s], [(j + 1) * s, (k - j - 1) * s]);
  const forma = (x, y) => {
    const p = [...L.map(([a, b]) => [a, b]), ...[...L].reverse().map(([a, b]) => [w - a, b]),
               ...L.map(([a, b]) => [w - a, h - b]), ...[...L].reverse().map(([a, b]) => [a, h - b])];
    c.beginPath(); p.forEach(([a, b], i) => i ? c.lineTo(x + a, y + b) : c.moveTo(x + a, y + b)); c.closePath();
  };
  c.save(); c.shadowColor = "rgba(255,0,0,.45)"; c.shadowBlur = brillo; c.fillStyle = "#2a0000"; forma(pad, pad + 2 * prof); c.fill(); c.restore();
  c.fillStyle = "#2a0000"; forma(pad, pad + 2 * prof); c.fill();
  c.fillStyle = "#5a0000"; forma(pad, pad + prof); c.fill();
  c.fillStyle = "#2a0000"; forma(pad, pad); c.fill();
}

function ajustar() {
  const grid = $("#grid"), hueco = $("#hueco"), mesa = $("#mesa");
  const B = parseFloat(getComputedStyle(mesa).borderLeftWidth) || 12;
  const hr = hueco.getBoundingClientRect();
  const cw = Math.max(160, Math.min(hr.width * .93 - 2 * B, (hr.height * .93 - 2 * B) / ASP));
  const bh = cw * ASP + 2 * B;
  mesa.style.width = (cw + 2 * B) + "px";
  mesa.style.height = bh + "px";
  hueco.style.perspective = (2.6 * Math.max(bh, cw * .75)) + "px";          // la inclinación se ajusta al tamaño del tablero
  mesa.style.transform = `translate(-50%, calc(-50% - ${(0.035 * bh).toFixed(1)}px)) rotateX(18deg)`;
  const base = $("#mesa-base");
  base.style.width = mesa.style.width; base.style.height = mesa.style.height; base.style.transform = mesa.style.transform;
  pintarBase(base, parseFloat(mesa.style.width), parseFloat(mesa.style.height));
  dpr = CONFIG.pixelesTablero / cw;
  escala = cw / W;
  lienzo.width = Math.round(cw * dpr); lienzo.height = Math.round(cw * ASP * dpr);
  estatico = document.createElement("canvas");
  estatico.width = lienzo.width; estatico.height = lienzo.height;
  const e = estatico.getContext("2d");
  e.setTransform(escala * dpr, 0, 0, escala * dpr, 0, 0);
  dibujarEstatico(e);
}

  c.fillStyle = "#7a0000"; c.beginPath(); c.moveTo(x - 28, y - 14); c.lineTo(x + 28, y - 14); c.lineTo(x + 11, y + 14); c.lineTo(x - 11, y + 14); c.closePath(); c.fill();
  const g = c.createLinearGradient(x - 28, 0, x + 28, 0); g.addColorStop(0, "#ff4a4a"); g.addColorStop(.5, "#ff0000"); g.addColorStop(1, "#8a0000");
  c.fillStyle = g; c.beginPath(); c.moveTo(x - 28, y - 18); c.lineTo(x + 28, y - 18); c.lineTo(x + 11, y + 10); c.lineTo(x - 11, y + 10); c.closePath(); c.fill();
  c.fillStyle = "#ffffff"; c.fillRect(x - 30, y - 22, 60, 5);
  if (cargada) c.drawImage(sprites[t.tipo.id], x - R, y - 12, 2 * R, 2 * R);
}

function dibujarBola(c, b) {
  c.fillStyle = "rgba(0,0,0,.45)"; c.beginPath(); c.ellipse(b.x + 5, b.y + 8, R * .95, R * .75, 0, 0, 6.2832); c.fill();
  const s = R * 2.05;
  if (b.tipo === "dorada") { c.fillStyle = "rgba(255,211,77,.25)"; c.beginPath(); c.arc(b.x, b.y, R * 1.9, 0, 6.2832); c.fill(); }
  c.drawImage(sprites[b.tipo], b.x - s / 2, b.y - s / 2 - 3, s, s);
}

let ultimo = 0;
function bucle(ts) {
  requestAnimationFrame(bucle);
  if (pantallaActual !== "juego" || !G || !estatico) { ultimo = ts; return; }
  const dt = Math.min(.05, (ts - ultimo) / 1000 || 0); ultimo = ts;
  actualizar(dt);
  dibujar(dt);
}
requestAnimationFrame(bucle);

function actualizar(dt) {
  // tolva
  const t = G.tolva;
  if (t.estado === "mover") {
    const d = t.objetivo - t.x, paso = 1900 * dt;
    if (Math.abs(d) <= paso) { t.x = t.objetivo; t.estado = "espera"; t.espera = .12; }
    else t.x += Math.sign(d) * paso;
  } else if (t.estado === "espera") {
    t.espera -= dt;
    if (t.espera <= 0) {
      G.activas.push(nuevaBola(t.x, t.tipo));
      t.estado = "enfriar"; t.espera = .45;
    }
  } else if (t.estado === "enfriar") {
    t.espera -= dt;
    if (t.espera <= 0) { t.estado = "reposo"; G.lanzando = false; actualizarHUD(); }
  }
  if (t.estado === "reposo" || t.estado === "enfriar") {
    const d = G.elegido - t.x, paso = 1500 * dt;
    t.x = Math.abs(d) <= paso ? G.elegido : t.x + Math.sign(d) * paso;
  }
  // física
  G.acum += dt;
  let n = 0;
  while (G.acum >= DT && n < 24) {
    for (const b of G.activas) if (!b.fin) paso(b, eventos);
    G.acum -= DT; n++;
  }
  if (G.acum > DT * 24) G.acum = 0;
  G.activas = G.activas.filter(b => !b.fin);

  // efectos
  BUMPERS.forEach(m => { m.p = Math.max(0, m.p - dt * 4); });
  for (let i = 0; i < NC; i++) G.destellos[i] = Math.max(0, G.destellos[i] - dt * 1.6);
  G.destelloBols = G.destelloBols.map(v => Math.max(0, v - dt * 1.6));
  G.destelloTuerca = Math.max(0, G.destelloTuerca - dt * 1.4);
  G.sacudida = Math.max(0, G.sacudida - dt * 1.2);
  G.textos.forEach(x => x.t += dt); G.textos = G.textos.filter(x => x.t < x.dur);
  G.particulas.forEach(p => { p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
  G.particulas = G.particulas.filter(p => p.t < p.dur);

  // marcador animado
  if (puntosMostrados !== G.puntos) {
    const dif = G.puntos - puntosMostrados;
    puntosMostrados += Math.sign(dif) * Math.max(1, Math.ceil(Math.abs(dif) * Math.min(1, dt * 7)));
    if (Math.abs(G.puntos - puntosMostrados) < 1) puntosMostrados = G.puntos;
    $("#puntos").textContent = puntosMostrados;
  }

  // ¿fin de la partida?
  if (!G.terminado && G.bolas <= 0 && !G.activas.length && !G.lanzando) {
    G.terminado = true; actualizarHUD();
    esperar(1300, finPartida);
  }
}

function dibujar(dt) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(estatico, 0, 0);
  c.setTransform(escala * dpr, 0, 0, escala * dpr, 0, 0);
  if (G.sacudida > 0) c.translate((Math.random() - .5) * 8 * G.sacudida, (Math.random() - .5) * 8 * G.sacudida);

  // destellos de casillas y agujeros
  for (let i = 0; i < NC; i++) if (G.destellos[i] > 0) {
    c.fillStyle = `rgba(255,${Math.round(60 + 160 * G.destellos[i])},40,${.55 * G.destellos[i]})`;
    c.fillRect(i * SW + 3, DIV_Y0, SW - 6, H - DIV_Y0);
  }
  POCKETS.forEach((p, i) => { if (G.destelloBols[i] > 0) { c.fillStyle = `rgba(255,255,255,${.7 * G.destelloBols[i]})`; c.beginPath(); c.arc(p.x, p.y, 10 + 22 * (1 - G.destelloBols[i]), 0, 6.2832); c.fill(); } });
  if (G.destelloTuerca > 0) { c.fillStyle = `rgba(255,60,60,${.8 * G.destelloTuerca})`; c.beginPath(); c.arc(NUT.x, NUT.y, 16 + 50 * (1 - G.destelloTuerca), 0, 6.2832); c.fill(); }

  // guía de puntería
  if (!G.terminado && G.bolas > 0) {
    c.save(); c.setLineDash([6, 8]); c.lineWidth = 3; c.strokeStyle = "rgba(255,255,255,.55)";
    c.beginPath(); c.moveTo(G.tolva.x, 66); c.lineTo(G.tolva.x, 140); c.stroke(); c.restore();
    c.fillStyle = "rgba(255,255,255,.75)"; c.beginPath(); c.moveTo(G.tolva.x - 9, 136); c.lineTo(G.tolva.x + 9, 136); c.lineTo(G.tolva.x, 150); c.closePath(); c.fill();
    if (!G.apuntado) {
      c.textAlign = "center"; c.textBaseline = "middle"; c.font = "800 26px system-ui, Arial"; c.fillStyle = `rgba(255,255,255,${.6 + .4 * Math.sin(performance.now() / 280)})`;
      c.fillText("Toca el tablero para elegir dónde soltar", W / 2, 106);
    }
  }
  BUMPERS.forEach(m => dibujarArandela(c, m));
  dibujarTolva(c, G.tolva, G.tolva.estado === "mover" || G.tolva.estado === "espera");
  G.activas.forEach(b => dibujarBola(c, b));

  // partículas
  G.particulas.forEach(p => {
    c.globalAlpha = Math.max(0, 1 - p.t / p.dur);
    c.fillStyle = p.col; c.save(); c.translate(p.x, p.y); c.rotate(p.rot + p.t * 6); c.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); c.restore();
  });
  c.globalAlpha = 1;
  // textos flotantes
  c.textAlign = "center"; c.textBaseline = "middle";
  G.textos.forEach(x => {
    const k = x.t / x.dur;
    c.globalAlpha = k < .7 ? 1 : 1 - (k - .7) / .3;
    c.font = `900 ${x.size}px system-ui, Arial`;
    c.lineWidth = 6; c.strokeStyle = "rgba(0,0,0,.85)"; c.lineJoin = "round";
    const y = x.y - 70 * k, px = Math.max(55, Math.min(W - 55, x.x));
    c.strokeText(x.txt, px, y); c.fillStyle = x.col; c.fillText(x.txt, px, y);
  });
  c.globalAlpha = 1;
}

/* =====================================================
   FIN DE PARTIDA, NOMBRE Y RANKING
   ===================================================== */
function finPartida() {

  $("#aviso-pts").textContent = G.puntos;

function pintarNombre() {

document.addEventListener("keydown", e => {

/* Modo encargado: mantén pulsado 3 segundos el título «Ranking» para borrar o descargar */

<script src="config-google.js"></script>
<script>
/* =====================================================
   COPIA AUTOMÁTICA DEL RANKING EN GOOGLE
   La hoja de Google es el ranking "de verdad": aunque se cambie la página,
   el navegador o la pantalla, al abrir cualquier juego se recupera de allí.
   - Las partidas nuevas se envían en cuanto se guardan (y se reintentan si no hay internet).
   - Lo que se borra en modo encargado se oculta también en la hoja (no se pierde: queda marcado).
   - Cada minuto se descarga el ranking de la hoja y se junta con lo que aún no se ha enviado.
   La dirección del Apps Script se pone en config-google.js (misma carpeta).
   ===================================================== */
(function () {
  const JUEGOS = { quizRanking: "Quiz", pachinkoRanking: "Pachinko", comecocosRanking: "Cometornillos" };
  const CLAVE_DE = Object.fromEntries(Object.entries(JUEGOS).map(([k, v]) => [v, k]));
  const ENVIADOS = "copiaGoogleEnviados", BORRADOS = "copiaGoogleBorrados", URL_GUARDADA = "copiaGoogleURL";
  const MAX_LOCAL = 100;
  const leer = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let enviando = false, ultimoEstado = "";

  // la dirección de config-google.js; si algún día falta, se usa la última que funcionó
  function direccion() {
    const u = (window.COPIA_GOOGLE_URL || "").trim();
    if (u) { try { localStorage.setItem(URL_GUARDADA, u); } catch (e) {} return u; }
    try { return localStorage.getItem(URL_GUARDADA) || ""; } catch (e) { return ""; }
  }
  const clave = () => window.COPIA_GOOGLE_CLAVE || "ferreteria-vert";
  function estado(txt, tipo = "") {
    ultimoEstado = txt;
    const el = document.getElementById("estado-google");
    if (el) { el.textContent = "☁ Copia en Google: " + txt; el.className = "estado-google " + tipo; }
  }
  function pendientes() {
    const enviados = new Set(leer(ENVIADOS, []));
    const out = [];
    for (const [k, juego] of Object.entries(JUEGOS)) {
      for (const e of leer(k, [])) {
        if (!e || !e.f) continue;
        const id = juego + "-" + e.f;
        if (!enviados.has(id)) out.push({ id, juego, nombre: String(e.n || ""), puntos: Number(e.p) || 0, fecha: new Date(e.f).toISOString(), detalle: e.t || "" });
      }
    }
    return out;
  }
  async function enviar(datos) {
    const r = await fetch(direccion(), { method: "POST", body: JSON.stringify(Object.assign({ clave: clave() }, datos)) });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) || "respuesta rara");
    return j;
  }

  /* El encargado borra en la pantalla → se oculta también en la hoja */
  function borrar(claveRanking, fechas) {
    const juego = JUEGOS[claveRanking]; if (!juego) return;
    const cola = leer(BORRADOS, []);
    if (fechas === "todo") cola.push({ juego, todo: true, desde: Date.now() });
    else fechas.forEach(f => cola.push({ juego, id: juego + "-" + f }));
    escribir(BORRADOS, cola);
    setTimeout(sincronizar, 300);
  }

  /* Junta el ranking de la hoja con lo que aún no ha llegado a ella */
  function juntar(rankingGoogle) {
    const cola = leer(BORRADOS, []);
    const enviados = new Set(leer(ENVIADOS, []));
    for (const [k, juego] of Object.entries(JUEGOS)) {
      const deGoogle = (rankingGoogle[juego] || []).map(e => ({ n: e.n, p: e.p, t: e.t || undefined, f: e.f }));
      deGoogle.forEach(e => enviados.add(juego + "-" + e.f));
      const ids = new Set(deGoogle.map(e => e.f));
      const sinEnviar = leer(k, []).filter(e => e && e.f && !ids.has(e.f) && !enviados.has(juego + "-" + e.f));
      const ocultar = e => cola.some(b => b.juego === juego && (b.id === juego + "-" + e.f || (b.todo && e.f <= b.desde)));
      const lista = deGoogle.concat(sinEnviar).filter(e => !ocultar(e))
        .sort((a, b) => b.p - a.p || a.f - b.f).slice(0, MAX_LOCAL);
      escribir(k, lista);
    }
    escribir(ENVIADOS, [...enviados].slice(-3000));
    // refrescar lo que se esté viendo
    try { if (typeof pantallaActual !== "undefined" && pantallaActual === "ranking" && !(typeof modoAdmin !== "undefined" && modoAdmin) && typeof pintarRanking === "function") pintarRanking(null); } catch (e) {}
    document.dispatchEvent(new CustomEvent("ranking-actualizado"));
  }

  async function sincronizar() {
    if (!direccion()) { estado("sin configurar (falta la dirección en config-google.js)"); return; }
    if (enviando) return;
    if (navigator.onLine === false) { estado("sin conexión; " + pendientes().length + " pendientes", "mal"); return; }
    enviando = true;
    try {
      // 1) borrados hechos en modo encargado
      const cola = leer(BORRADOS, []);
      if (cola.length) { await enviar({ accion: "borrar", borrar: cola }); escribir(BORRADOS, leer(BORRADOS, []).slice(cola.length)); }
      // 2) partidas nuevas
      let lote;
      while ((lote = pendientes().slice(0, 50)).length) {
        estado("enviando " + lote.length + "…");
        await enviar({ accion: "guardar", filas: lote });
        escribir(ENVIADOS, leer(ENVIADOS, []).concat(lote.map(x => x.id)).slice(-3000));
      }
      // 3) ranking de la hoja
      const r = await fetch(direccion() + (direccion().includes("?") ? "&" : "?") + "accion=ranking&clave=" + encodeURIComponent(clave()) + "&n=" + MAX_LOCAL);
      const j = await r.json();
      if (!j || !j.ok) throw new Error((j && j.error) || "respuesta rara");
      juntar(j.ranking || {});
      estado("al día ✓ (" + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) + ")", "ok");
    } catch (e) {
      estado(navigator.onLine === false || e instanceof TypeError ? "sin conexión, se reintentará" : "error (" + e.message + ")", "mal");
    }
    enviando = false;
  }
  window.copiaGoogle = { sincronizar, borrar, pendientes: () => pendientes().length, get estado() { return ultimoEstado; } };
  setTimeout(sincronizar, 1500);
  setInterval(sincronizar, 60 * 1000);
  window.addEventListener("online", sincronizar);
  // justo después de guardar un nombre en el ranking, y al abrir el ranking
  document.addEventListener("click", e => {
    const id = e.target && e.target.id;
    if (id === "guardar") setTimeout(sincronizar, 800);
    if (id === "ver-ranking") setTimeout(sincronizar, 100);
  }, true);
})();
</script>
</body>
</html>
